[package]
name = "universal-util"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# UI and Async
slint = "1.6"
futures = "0.3"
anyhow = "1.0"
zip = "0.6"
walkdir = "2.4"


# Performance and Bulk Processing
rayon = "1.8"
rfd = "0.14"

# Image and File Processing
image = "0.24"
oxipng = { version = "9.1", features = ["parallel"] } # Added parallel for speed
infer = "0.19"

# Media Conversion
rust_ffmpeg = "0.1"

[build-dependencies]
slint-build = "1.6"
cc = "1.0"
winres = "0.1" # CRITICAL: This allows your build.rs to set the icon and safety info
